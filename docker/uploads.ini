; Upload limits (Leandro's bug report, 2026-09-05; raised to 100MB 2026-09-08).
;
; The image ships PHP's stock 2M upload_max_filesize while the panel's attachment
; fields promise a larger figure. A file between the two never reached Laravel at
; all: PHP dropped the part, Livewire wrote its metadata sidecar and then 500'd
; trying to read the missing binary back — the "Error while loading page" toast on
; Open New Ticket, with nothing in the validator's voice about what went wrong.
;
; So these must always sit ABOVE what the forms promise. The forms accept 100MB
; (max:102400 in the ticket validators), so 128M keeps headroom and oversized
; files reach the Laravel validator, which rejects them with a real message
; instead of a toast. post_max_size covers a few files in one request plus the
; Livewire envelope, and memory_limit has to clear post_max_size or PHP fails
; while assembling the request rather than while validating it.
upload_max_filesize = 128M
post_max_size = 160M
memory_limit = 256M
