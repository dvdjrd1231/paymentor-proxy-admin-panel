; Upload limits (Leandro's bug report, 2026-09-05).
;
; The image ships PHP's stock 2M upload_max_filesize while the panel's attachment
; fields promise 10MB. A file between the two never reached Laravel at all: PHP
; dropped the part, Livewire wrote its metadata sidecar and then 500'd trying to
; read the missing binary back — the "Error while loading page" toast on Open New
; Ticket, with nothing in the validator's voice about what went wrong.
;
; 12M keeps headroom above the promised 10MB so oversized files now reach the
; Laravel validator, which rejects them with a real message ("must not be greater
; than 10240 kilobytes") instead of a toast. post_max_size covers a few files in
; one request plus the Livewire envelope.
upload_max_filesize = 12M
post_max_size = 40M
