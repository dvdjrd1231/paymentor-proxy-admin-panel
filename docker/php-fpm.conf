; PHP-FPM configuration for the admin panel — a full replacement for the image's own
; /usr/local/etc/php-fpm.conf.
;
; It has to be a replacement rather than an added pool file: the image's php-fpm.conf
; declares the [www] pool inline and never includes php-fpm.d/*.conf, so a dropped-in
; pool file is silently ignored. That cost us a round of "why did nothing change".
;
; Everything below the sizing block is copied from the image verbatim — user, group,
; listen address and clear_env must not drift, or PHP stops answering nginx at all.
[www]

user = nginx
group = nginx

listen = 127.0.0.1:9000
listen.owner = nginx
listen.group = nginx
listen.mode = 0750

; The sizing, and the reason for this file.
;
; One admin page is not one request: Filament renders each widget and each Livewire
; component as its own round trip, so opening the dashboard fires ten or more at once.
; The image allowed nine workers on demand, so the eleventh request waited for the first
; to finish — measured here as page loads spiking from 2.5s to 30s whenever requests
; overlapped, with the server itself sitting at zero load the whole time.
;
; dynamic, not ondemand: ondemand pays process-spawn latency on exactly the burst this
; workload is made of. Eight are kept warm so a burst is served immediately.
;
; 32 on a 2-core, 4 GB box: these workers measure ~45 MB, so the ceiling is ~1.4 GB,
; comfortable beside MariaDB and Redis (under 200 MB together). The binding constraint
; is concurrency, not CPU — the requests are waiting on the database, not computing.
pm = dynamic
pm.max_children = 32
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 12

; Recycle occasionally so a slow leak cannot grow without bound. Raised from the image's
; 200 because respawning is not free and these workers are not leaky.
pm.max_requests = 500

clear_env = no
